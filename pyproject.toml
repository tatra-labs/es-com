[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "es-com"
version = "0.1.0"
description = "An evolution-strategies step read as a displacement to the reward-weighted centre of mass"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tatra-labs"}]
keywords = ["evolution-strategies", "optimization", "black-box", "es", "cma-es", "numpy"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]
experiments = ["matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/tatra-labs/es-com"

[tool.setuptools]
packages = ["es_com"]
